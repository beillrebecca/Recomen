<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recomen</title>

<!-- Google Fonts -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Galada&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Source+Han+Sans+JP&family=IPAex+Mincho&family=Sawarabi+Gothic&display=swap" rel="stylesheet">

<!-- アイコン -->
<script src="https://unpkg.com/lucide@latest"></script>

<!-- カラーピッカー -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/nano.min.css">
<script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>

<!-- CSS -->
<link rel="stylesheet" href="style.css">
</head>
<body class="theme-natural">

<!-- ===== トップバー ===== -->
<div class="top-bar">
  <div class="logo">Recomen</div>
  <div class="hamburger">
    <span></span><span></span><span></span>
  </div>
</div>

<!-- ===== カスタムバー（編集バー） ===== -->
<div class="custom-bar">

  <!-- 編集ボタン -->
  <button id="editToggle" class="edit-toggle-btn">ショーケースを編集</button>

  <!-- 編集項目 -->
  <div class="edit-items" id="editItems">
    <!-- テーマ -->
    <div class="edit-item" id="themeButton">
      <span>テーマ</span>
      <div class="popup" id="themePopup">
        <label class="theme-option">
          <input type="radio" name="theme" value="natural" checked="">
          <span class="label-text">ナチュラル</span>
        </label>
        <label class="theme-option">
          <input type="radio" name="theme" value="modern">
          <span class="label-text">モダン</span>
        </label>
      </div>
    </div>

    <!-- スタイル -->
    <div class="edit-item" id="styleButton">
      <span>スタイル</span>
      <div class="popup" id="stylePopup" style="display: none;">
        <label class="color-field">
          <span class="label">Background</span>
          <div id="bgPicker"></div>
        </label>
        <label>
          <span class="label">Font</span>
          <select id="fontSelect">
            <option value="'Source Han Sans JP', sans-serif">Source Han Sans JP</option>
            <option value="'IPAex Mincho', serif">IPAex Mincho</option>
            <option value="'Sawarabi Gothic', sans-serif">Sawarabi Gothic</option>
          </select>
        </label>
        <label class="color-field">
          <span class="label">Font Color</span>
          <div id="fontColorPicker"></div>
        </label>
        <label class="color-field">
          <span class="label">Profile Background</span>
          <div id="profileBgPicker"></div>
        </label>
      </div>
    </div>

    <!-- アナウンスバー -->
    <div class="edit-item" id="announcementButton">
      <span>アナウンスバー</span>
      <div class="popup" id="announcementPopup" style="display: none;">
        <label class="toggle-field">
          <span class="label">Show Announcement</span>
          <input type="checkbox" id="announcementToggle" checked="">
        </label>
        <label>
          <span class="label">Text</span>
          <input type="text" id="bannerTextInput" placeholder="アナウンスバーのテキスト" value="アナウンスバーのテキスト">
        </label>
        <label class="color-field">
          <span class="label">Background</span>
          <div id="announcementBgPicker"></div>
        </label>
      </div>
    </div>
  </div>
</div>

<!-- ===== ヘッダー ===== -->
<div class="header">
  <img id="headerImg" src="https://via.placeholder.com/1200x260">
  <input type="file" id="headerImgInput" style="display:none;">
</div>

<!-- ===== メインコンテンツ ===== -->
<div class="main-content-wrapper">

  <!-- アナウンスバー -->
  <div id="announcementBar" class="announcement-bar" style="display: flex; align-items: center; overflow: hidden; position: relative; height: 40px; padding: 0px 10px;">
    <span class="banner-text" style="position: absolute; white-space: nowrap; top: 50%; transform: translateY(-50%); font-size: 16px; line-height: 1; left: 122px;">アナウンスバーのテキスト</span>
  </div>

  <!-- プロフィール -->
  <div class="profile">
    <div class="profile-top">
      <div class="avatar">
        <img id="avatarImg" src="https://example.com/blue-user-icon.png" alt="プロフィールアイコン">
        <input type="file" id="avatarImgInput" accept="image/*" style="display:none;">
      </div>
      <div class="profile-info">
        <div id="profileName" class="profile-name" contenteditable="true">プロフィール名</div>
        <div class="profile-stats">
          <span id="followingBtn" class="stat-item"><strong>123</strong> フォロー中</span>
          <span id="followersBtn" class="stat-item"><strong>456</strong> フォロワー</span>
        </div>
      </div>
    </div>
    <div class="profile-bottom">
      <div id="profileBio" class="profile-desc" contenteditable="true">プロフィール紹介文</div>
    </div>
  </div>

  <!-- モーダル（フォロー/フォロワー） -->
  <div class="modal" id="followModal">
    <div class="modal-content">
      <button class="close-btn">×</button>
      <div class="modal-title"></div>
      <ul class="user-list"></ul>
    </div>
  </div>
  
    <!-- ===== ショーケース（カードリスト） ===== -->
  <div id="showcase" class="showcase">
    <!-- カードはJSで生成されます -->
  </div>

  <!-- ===== 保存ボタン ===== -->
  <div class="save-wrapper" style="text-align:center; margin: 20px 0;">
    <button id="saveBtn" class="save-btn">保存</button>
  </div>

</div> <!-- main-content-wrapper 終了 -->

<!-- ===== フッター ===== -->
<footer class="footer" style="text-align:center; padding:20px; font-size:14px; color:#777;">
  &copy; 2026 Recomen
</footer>

<!-- ===== JavaScript ===== -->
<script src="app.js"></script>

</body>
</html>
