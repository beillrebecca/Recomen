<link href="https://fonts.googleapis.com/css2?family=Galada&display=swap" rel="stylesheet">

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Recomen - ログイン</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-container">

  <div class="login-box">
    <h1 class="logo">Recomen</h1>

    <input type="text" id="username" placeholder="ユーザーネームまたはメール">
    <input type="password" id="password" placeholder="パスワード">

    <button id="loginBtn">ログイン</button>

    <div class="divider">または</div>

    <button id="guestBtn" class="guest-btn">ゲストでログイン</button>

    <p class="signup-link">
      アカウントをお持ちでないですか？ 
      <span id="goSignup">登録する</span>
    </p>
  </div>

</div>

<script src="js/script.js"></script>
</body>
</html>
